name: Dependency Guard

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - "docs/dependency-provenance-exceptions.md"
      - "scripts/deps-provenance.ts"
  # A varredura semanal fecha o buraco conhecido do portão de PR: o npm para no
  # primeiro pacote pendente, então a passagem por PR não enxerga um segundo que
  # ficasse atrás. Aqui a árvore inteira é enumerada e comparada com a lista.
  # Segunda, 06:40 UTC.
  schedule:
    - cron: "40 6 * * 2"

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      # Wrapper, e não `npm audit signatures` cru: o npm para no primeiro pacote
      # pendente, então ele não consegue dizer se a falha está contida na lista
      # de exceções. No PR o wrapper confere a coordenada que o npm nomeou; na
      # varredura semanal ele enumera a árvore inteira. Falha para o lado
      # fechado nos dois modos. Ver docs/dependency-provenance-exceptions.md.
      - name: Verify npm registry signatures
        run: npm run deps:provenance${{ github.event_name == 'schedule' && ' -- --sweep' || '' }}

      - name: Audit known vulnerabilities
        run: npm audit --audit-level=high

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
