# A Release do Dinopad é criada apenas quando uma tag de versão é empurrada
# (ex.: git tag -a v0.1.0 -m "Dinopad v0.1.0" && git push origin v0.1.0).
# Pushes em main continuam publicando o site (deploy.yml) e não criam release.
#
# Este arquivo é só o caller: dispara, declara a matrix e chama o release-core.
# Toolchain, arte, notas, seções e as fontes de versão vivem em
# .github/release.config.json.
#
# O workflow_dispatch existe para operação controlada — reexecutar um run que
# falhou, ou corrigir a arte de uma tag já publicada. Ele NÃO é um segundo
# mecanismo de versionamento: o release-core rejeita qualquer tag que não
# exista (git rev-parse refs/tags/<tag>), então o dispatch só pode reprocessar
# uma tag que já foi criada.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de versão já publicada (ex.: v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Event-aware de propósito: em `workflow_dispatch` o `github.ref` é a branch
  # padrão, então um grupo só com `github.ref` faz todas as execuções manuais
  # colidirem entre si.
  group: "release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
  # Release não é job descartável: um run cancelado no meio deixa a tag nomeada
  # sem release.
  cancel-in-progress: false

jobs:
  release:
    # O GITHUB_TOKEN do caller só pode ser rebaixado, nunca elevado. O Core
    # declara contents: write como teto; o caller precisa ter o mesmo, ou o
    # rebaixamento falha.
    permissions:
      contents: write
    uses: mafhper/release-core/.github/workflows/release.yml@v1.2.5
    with:
      matrix: '[{"os":"ubuntu-latest"}]'
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
