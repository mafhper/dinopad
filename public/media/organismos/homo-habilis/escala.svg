<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Escala aproximada de Homo habilis</title>
  <desc id="desc">Régua educativa mostra a medida máxima publicada para Homo habilis: 1.8 m.</desc>
  <rect width="960" height="360" rx="24" fill="#f1ead7"/>
  <text x="56" y="66" font-family="system-ui, sans-serif" font-size="18" letter-spacing="2" fill="#875711">ESCALA APROXIMADA</text>
  <text x="56" y="118" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#34362f">Homo habilis</text>
  <text x="56" y="154" font-family="system-ui, sans-serif" font-size="22" fill="#5f6258">Estatura aproximada: até 1,8 m</text>
  <path d="M70 228H860" stroke="#3f4939" stroke-width="8" stroke-linecap="round"/>
  <path d="M70 212V252" stroke="#3f4939" stroke-width="4"/><text x="70" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#5f6258">0</text><path d="M149 212V242" stroke="#3f4939" stroke-width="2"/><text x="149" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5f6258">0,18</text><path d="M228 212V242" stroke="#3f4939" stroke-width="2"/><text x="228" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5f6258">0,36</text><path d="M307 212V242" stroke="#3f4939" stroke-width="2"/><text x="307" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5f6258">0,54</text><path d="M386 212V242" stroke="#3f4939" stroke-width="2"/><text x="386" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5f6258">0,72</text><path d="M465 212V252" stroke="#3f4939" stroke-width="4"/><text x="465" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#5f6258">0,9</text><path d="M544 212V242" stroke="#3f4939" stroke-width="2"/><text x="544" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5f6258">1,08</text><path d="M623 212V242" stroke="#3f4939" stroke-width="2"/><text x="623" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5f6258">1,26</text><path d="M702 212V242" stroke="#3f4939" stroke-width="2"/><text x="702" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5f6258">1,44</text><path d="M781 212V242" stroke="#3f4939" stroke-width="2"/><text x="781" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5f6258">1,62</text><path d="M860 212V252" stroke="#3f4939" stroke-width="4"/><text x="860" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#5f6258">1,8</text>
  <text x="870" y="280" font-family="system-ui, sans-serif" font-size="17" fill="#5f6258">m</text>
  <text x="904" y="330" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" fill="#73766d">Régua proporcional; sem silhueta anatômica inventada</text>
</svg>