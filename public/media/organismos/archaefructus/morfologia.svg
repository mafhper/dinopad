    <text x="555" y="74">estrutura reprodutiva</text><path d="M545 81L512 72" stroke="#73766d" stroke-width="2"/>
    <text x="714" y="293">folha ou ramo foliar</text><path d="M706 278L655 258" stroke="#73766d" stroke-width="2"/>
