  </g>
  <text x="56" y="506" font-family="Georgia, serif" font-size="29" font-style="italic" font-weight="700" fill="#34362f">Archaefructus liaoningensis</text>
  <text x="904" y="506" text-anchor="end" font-family="system-ui, sans-serif" font-size="19" fill="#5f6258">planta quase completa preservada: 1–1 unid</text>
  <text x="904" y="538" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" fill="#73766d">Forma simplificada; proporções e partes variam conforme a preservação</text>
