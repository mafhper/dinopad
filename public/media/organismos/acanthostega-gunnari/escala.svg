  <text x="56" y="118" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#34362f">Acanthostega gunnari</text>
  <text x="56" y="154" font-family="system-ui, sans-serif" font-size="22" fill="#5f6258">Comprimento estimado: até 0,7 m</text>
